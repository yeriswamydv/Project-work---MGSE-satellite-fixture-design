<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerShare Studio v14 | Aerospace MGSE & Drawings Hub</title>
<style>
  :root {
    --bg-base: #090d16;
    --bg-sidebar: #0f172a;
    --bg-card: #1e293b;
    --bg-card-header: #172033;
    --border: #334155;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.25);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --sheet-color: #10b981;
    --doc-color: #3b82f6;
    --ppt-color: #f97316;
    --graph-color: #a855f7;
    --vault-color: #ec4899;
    --dwg-color: #06b6d4;
    --cad-color: #38bdf8;
    --elec-color: #facc15;
    --mecha-color: #c084fc;
    --status-green: #22c55e;
    --status-yellow: #eab308;
    --status-orange: #f97316;
    --status-red: #ef4444;
    --danger: #ef4444;
  }

  body.theme-light {
    --bg-base: #f1f5f9;
    --bg-sidebar: #ffffff;
    --bg-card: #ffffff;
    --bg-card-header: #f8fafc;
    --border: #cbd5e1;
    --accent: #0284c7;
    --accent-glow: rgba(2, 132, 199, 0.2);
    --text-main: #0f172a;
    --text-muted: #64748b;
  }

  body.theme-oled {
    --bg-base: #000000;
    --bg-sidebar: #080808;
    --bg-card: #101010;
    --bg-card-header: #141414;
    --border: #262626;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.25);
    --text-main: #ffffff;
    --text-muted: #a3a3a3;
  }

  body.theme-slate {
    --bg-base: #1e293b;
    --bg-sidebar: #273549;
    --bg-card: #334155;
    --bg-card-header: #2e3e54;
    --border: #475569;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.25);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-base);
    color: var(--text-main);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  header {
    background: var(--bg-sidebar);
    border-bottom: 1px solid var(--border);
    height: 48px;
    padding: 0 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 700;
  }

  .brand-chip {
    background: linear-gradient(135deg, #0284c7, #38bdf8);
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .theme-select {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    outline: none;
    cursor: pointer;
  }

  .view-mode-toggle {
    display: flex;
    background: var(--bg-base);
    padding: 3px;
    border-radius: 6px;
    border: 1px solid var(--border);
    gap: 3px;
  }

  .mode-toggle-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .mode-toggle-btn.active {
    background: var(--accent);
    color: #090d16;
  }

  .btn-icon {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-main);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-weight: 600;
    transition: all 0.15s ease;
    text-decoration: none;
  }
  .btn-icon:hover { background: var(--border); color: #fff; }
  .btn-icon-primary { background: var(--accent); color: #090d16; border-color: var(--accent); }
  .btn-icon-primary:hover { filter: brightness(1.1); }
  .btn-icon-danger { color: var(--danger); }
  .btn-icon-danger:hover { background: var(--danger); color: #fff; }

  .workspace-layout {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  .left-sidebar {
    width: 230px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 14px 10px;
    flex-shrink: 0;
    z-index: 20;
    transition: width 0.2s ease;
  }

  .nav-group-title {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 0 8px 10px 8px;
  }

  .tool-item-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 12px;
    border-radius: 8px;
    background: var(--bg-card);
    border: 1px solid transparent;
    color: var(--text-main);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 6px;
    transition: all 0.15s ease;
  }

  .tool-item-btn:hover {
    background: var(--border);
    transform: translateX(2px);
  }

  .tool-item-btn.active-tool {
    border-color: var(--accent);
    background: rgba(56, 189, 248, 0.15);
    box-shadow: 0 0 10px var(--accent-glow);
  }

  .tool-icon-text {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .indicator-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #475569;
  }

  .canvas-stage {
    flex: 1;
    display: flex;
    gap: 12px;
    padding: 12px;
    background: var(--bg-base);
    overflow: hidden;
  }

  .window-panel {
    flex: 1;
    height: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
  }

  .canvas-stage.mode-split .window-panel { min-width: 520px; }
  .canvas-stage.mode-fullscreen .window-panel { width: 100%; min-width: 100%; }

  .window-header {
    background: var(--bg-card-header);
    border-bottom: 1px solid var(--border);
    height: 42px;
    padding: 0 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
    flex-shrink: 0;
  }

  .window-title {
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .symbols-toolbar {
    background: var(--bg-card-header);
    border-bottom: 1px solid var(--border);
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .sym-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 4px 8px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
    font-weight: 600;
  }
  .sym-btn:hover { background: var(--border); }
  .sym-btn-danger:hover { background: var(--danger); border-color: var(--danger); color: #fff; }

  .sym-divider {
    width: 1px;
    height: 18px;
    background: var(--border);
    margin: 0 4px;
  }

  .window-content {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  /* Split Container with Pinnable Left Navigator */
  .vault-split-container {
    flex: 1;
    display: flex;
    overflow: hidden;
    background: var(--bg-base);
    position: relative;
  }

  .vault-tree-sidebar {
    width: 280px;
    background: var(--bg-card);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 12px 8px;
    flex-shrink: 0;
    transition: width 0.25s ease, transform 0.25s ease;
  }

  .vault-tree-sidebar.unpinned {
    width: 44px;
    overflow: hidden;
    cursor: pointer;
  }

  .vault-tree-sidebar.unpinned:hover {
    width: 280px;
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 50;
    box-shadow: 4px 0 20px rgba(0,0,0,0.5);
    background: var(--bg-card);
  }

  .vault-tree-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 8px 10px 8px;
    font-size: 11px;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }

  .disc-folder-group { margin-bottom: 10px; }
  .disc-folder-title {
    font-size: 12px;
    font-weight: 800;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.15s ease;
  }
  .disc-folder-title:hover { background: var(--border); }

  .subfolder-item {
    margin-left: 14px;
    padding: 6px 10px;
    border-left: 2px solid var(--border);
    border-radius: 0 6px 6px 0;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.15s ease;
    margin-top: 3px;
  }
  .subfolder-item:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.04); }
  .subfolder-item.active {
    background: rgba(56, 189, 248, 0.15);
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
  }

  .vault-browser-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 16px 20px;
    background: var(--bg-base);
  }

  .vault-browser-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .compact-dropzone {
    border: 2px dashed var(--accent);
    background: rgba(56, 189, 248, 0.05);
    border-radius: 8px;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    transition: all 0.15s ease;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  .compact-dropzone:hover { background: rgba(56, 189, 248, 0.15); }

  .vault-table-wrap {
    flex: 1;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-card);
  }

  table.vault-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
  table.vault-table th {
    background: var(--bg-card-header);
    color: var(--text-muted);
    padding: 9px 12px;
    font-weight: 700;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 5;
    text-transform: uppercase;
    font-size: 10px;
  }
  table.vault-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--text-main); }
  table.vault-table tr:hover td { background: rgba(255, 255, 255, 0.03); }

  /* Interactive Image Resizable Wrapper */
  .pasted-image-card {
    display: inline-block;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin: 10px 0;
    max-width: 100%;
    vertical-align: top;
  }
  .pasted-image-card img {
    border-radius: 6px;
    display: block;
    height: auto;
    transition: width 0.1s ease;
  }
  .image-controls-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    background: var(--bg-card-header);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
  }
  .image-controls-bar input[type="range"] {
    flex: 1;
    cursor: pointer;
    accent-color: var(--accent);
  }

  /* Doc & Markdown Preview Styles */
  .doc-split-editor { flex: 1; display: flex; gap: 12px; height: 100%; overflow: hidden; }
  .doc-pane { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  .doc-preview-pane {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.7;
  }
  .doc-preview-pane h1 { font-size: 22px; margin-bottom: 12px; color: var(--accent); }
  .doc-preview-pane h2 { font-size: 18px; margin: 14px 0 8px; color: var(--doc-color); }
  .doc-preview-pane h3 { font-size: 15px; margin: 12px 0 6px; color: var(--sheet-color); }
  .doc-preview-pane ul, .doc-preview-pane ol { margin-left: 20px; margin-bottom: 12px; }
  .math-formula {
    background: rgba(56, 189, 248, 0.1);
    color: #38bdf8;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: serif;
    font-size: 14px;
    border: 1px solid rgba(56, 189, 248, 0.25);
  }

  /* PDF Viewer Modal */
  .pdf-modal-backdrop {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .pdf-modal-content {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 90%;
    height: 90%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  footer.bottom-taskbar {
    height: 40px;
    background: var(--bg-sidebar);
    border-top: 1px solid var(--border);
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 25;
  }
  .active-pill {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .active-pill.active-focused { background: var(--border); box-shadow: 0 0 6px var(--accent-glow); }
</style>
</head>
<body class="theme-dark">

<header>

      <button class="mode-toggle-btn" id="btn-mode-split" onclick="setViewMode('split')">🪟 Side by Side</button>
    </div>

    <button class="btn-icon" onclick="exportDataJson()">💾 Export Data</button>

<div class="workspace-layout">

  <aside class="left-sidebar">

      <button class="tool-item-btn" id="btn-tool-doc" onclick="handleToolClick('doc')">
        <div class="tool-icon-text"><span>📝</span><span>Doc & Technical</span></div>
      </button>

      <button class="tool-item-btn" id="btn-tool-ppt" onclick="handleToolClick('ppt')">
        <div class="tool-icon-text"><span>📽️</span><span>PowerPoint</span></div>
      </button>

      <button class="tool-item-btn" id="btn-tool-graph" onclick="handleToolClick('graph')">

      </button>

      <button class="tool-item-btn active-tool" id="btn-tool-drawings" onclick="handleToolClick('drawings')">
        <div class="tool-icon-text"><span>📐</span><span>Drawing PDFs & Prints</span></div>
      </button>

      <button class="tool-item-btn" id="btn-tool-vault" onclick="handleToolClick('vault')">
        <div class="tool-icon-text"><span>📦</span><span>CAD Models Vault</span></div>
      </button>
    </div>

    <div class="sidebar-hint" style="font-size:11px; padding:10px; border:1px dashed var(--border); border-radius:6px; color:var(--text-muted);">
      💡 <strong>Universal Image Paste:</strong><br>
      Press <kbd>Ctrl+V</kbd> anywhere to paste CAD screenshots directly into Doc or Slides, then drag the slider to resize!
    </div>
  </aside>

  <!-- CANVAS STAGE -->
  <main class="canvas-stage mode-fullscreen" id="canvas-stage"></main>
</div>

<!-- BOTTOM TASKBAR -->
<footer class="bottom-taskbar">
  <div style="font-size:11px; color:var(--text-muted); display:flex; align-items:center; gap:8px;">
    <span>Active Tool:</span>
    <div id="active-pills-container" style="display:flex; gap:6px;"></div>
  </div>
  <div style="font-size:11px; color:var(--text-muted);" id="layout-indicator-label">Mode: Complete Screen</div>
</footer>

<!-- PDF PREVIEW MODAL -->
<div class="pdf-modal-backdrop" id="pdf-modal" onclick="closePdfModal(event)">
  <div class="pdf-modal-content" onclick="event.stopPropagation()">
    <div class="window-header">
      <div class="window-title" id="pdf-modal-title"><span>📐</span> PDF Drawing Inspection</div>
      <button class="btn-icon btn-icon-danger" onclick="closePdfModal()">✕ Close</button>
    </div>
    <iframe id="pdf-modal-frame" style="flex:1; width:100%; border:none; background:#fff;"></iframe>
  </div>
</div>

/* UNIVERSAL IMAGE CLIPBOARD PASTE & RESIZE CONTROLS                         */
/* ========================================================================= */
function setupGlobalImagePaste() {
  window.addEventListener("paste", function(e) {
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for (let index in items) {
      const item = items[index];
      if (item.kind === 'file' && item.type.startsWith('image/')) {
        const blob = item.getAsFile();
        const reader = new FileReader();
        reader.onload = function(event) {
          insertPastedImage(event.target.result);
        };
        reader.readAsDataURL(blob);
      }
    }
  });
}

function insertPastedImage(base64Data) {
  const imgObj = {
    id: "img_" + Date.now(),
    src: base64Data,
    widthPercent: 75,
    caption: "Pasted Engineering Screenshot"
  };

  if (focusedTool === 'doc') {
    const activeDoc = getActiveDocObject();
    activeDoc.obj.content += `\n\n[IMAGE:${imgObj.id}]\n`;
    workspaceData.pastedImages.push(imgObj);
    renderAll();
    saveState();
  } else if (focusedTool === 'ppt') {
    workspaceData.slides[currentSlideIndex].body += `\n[IMAGE:${imgObj.id}]`;
    workspaceData.pastedImages.push(imgObj);
    renderAll();
    saveState();
  } else {
    workspaceData.pastedImages.push(imgObj);
    alert("Image pasted into workspace memory! Focus on 'Doc' or 'PowerPoint' to insert directly into content.");
    saveState();
  }
}

function updateImageSize(imgId, newPercent) {
  const img = workspaceData.pastedImages.find(i => i.id === imgId);
  if (img) {
    img.widthPercent = newPercent;
    const el = document.getElementById("img-display-" + imgId);
    if (el) el.style.width = newPercent + "%";
    const label = document.getElementById("img-val-" + imgId);
    if (label) label.innerText = newPercent + "%";
    saveState();
  }
}

function removePastedImage(imgId) {
  workspaceData.pastedImages = workspaceData.pastedImages.filter(i => i.id !== imgId);
  const activeDoc = getActiveDocObject();
  activeDoc.obj.content = activeDoc.obj.content.replace(`[IMAGE:${imgId}]`, '');
  renderAll();
  saveState();
}

function renderImageMarkup(imgId) {
  const img = workspaceData.pastedImages.find(i => i.id === imgId);
  if (!img) return '';
  return `
    <div class="pasted-image-card" style="width:100%;">
      <img src="${img.src}" id="img-display-${img.id}" style="width:${img.widthPercent}%; max-width:100%; border:1px solid var(--border);" alt="Engineering Visual">
      <div class="image-controls-bar">
        <span>🔍 Size:</span>
        <input type="range" min="15" max="100" value="${img.widthPercent}" oninput="updateImageSize('${img.id}', this.value)">
        <span id="img-val-${img.id}" style="font-weight:700; width:40px;">${img.widthPercent}%</span>
        <button class="btn-icon" style="padding:2px 6px; font-size:10px;" onclick="updateImageSize('${img.id}', 50)">50%</button>
        <button class="btn-icon" style="padding:2px 6px; font-size:10px;" onclick="updateImageSize('${img.id}', 100)">100%</button>
        <button class="btn-icon btn-icon-danger" style="padding:2px 6px; font-size:10px;" onclick="removePastedImage('${img.id}')">✕ Delete</button>
      </div>
    </div>
  `;
}

/* SMART DOWNLOAD ENGINE */
function triggerSmartDownload(fileName, customUrl) {
  if (customUrl) {
    const a = document.createElement('a');
    a.href = customUrl;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    return;
  }

  const repoUrl = './vault/' + fileName;
  fetch(repoUrl, { method: 'HEAD' })
    .then(res => {
      if (res.ok) {
        const a = document.createElement('a');
        a.href = repoUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
      } else {
        fallbackBlobDownload(fileName);
      }
    })
    .catch(() => fallbackBlobDownload(fileName));
}

function fallbackBlobDownload(fileName) {
  let content = `PowerShare Aerospace Studio v14\nFile: ${fileName}\nProject: ICEYE Microsatellite MGSE Hub\nDate: ${new Date().toISOString()}\n\n[Notice: Client-side generated file placeholder. Real file not committed to ./vault/ yet.]`;
  const blob = new Blob([content], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function getActiveDocObject() {

function parseMarkdownAndMath(text) {
  if (!text) return '';
  let processed = text
    .replace(/\\varnothing/g, "Ø")
    .replace(/\\times/g, "×")
    .replace(/\$([^$]+)\$/g, '<span class="math-formula">$1</span>');

  // Replace image tokens with interactive visual cards
  processed = processed.replace(/\[IMAGE:([^\]]+)\]/g, function(m, id) {
    return renderImageMarkup(id);
  });

  return processed.split('\n').map(l => {
    if (l.startsWith('## ')) return `<h2>${l.substring(3)}</h2>`;
    if (l.startsWith('- ')) return `<li>${l.substring(2)}</li>`;
    return l.trim() ? `<p>${l}</p>` : '';
  }).join('');
}

      <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:32px;">

        <div style="font-size:15px; line-height:1.8;">${parseMarkdownAndMath(slide.body)}</div>
      </div>
    </div>
  `;
  return panel;
}

function buildGraphPanel(isSplit) {
  const panel = document.createElement("div");
  panel.className = "window-panel";
  panel.innerHTML = `
    <div class="window-header">
      <div class="window-title" style="color:var(--graph-color);"><span>📈</span> 3-Pillar Progress & Health</div>
      ${isSplit ? `<button class="btn-icon btn-icon-danger" onclick="handleToolClick('graph')">✕</button>` : ''}
    </div>
    <div class="window-content" style="padding:20px; display:flex; flex-direction:column; gap:16px;">
      <div style="background:var(--bg-card); padding:20px; border-radius:8px; border:1px solid var(--border);">
        <h3>🎯 Total Project Completion: 78%</h3>
        <p style="color:var(--text-muted); font-size:12px; margin-top:6px;">Calculated dynamically across Mechanical CAD, Cleanroom Electronics, and Mechatronics.</p>
      </div>
    </div>
  `;
  return panel;
}

/* MASTER RENDERER */
function renderAll() {
  ['sheet', 'doc', 'ppt', 'graph', 'drawings', 'vault'].forEach(tool => {
    const btn = document.getElementById(`btn-tool-${tool}`);
    if (btn) btn.classList.toggle('active-tool', viewMode === 'fullscreen' ? focusedTool === tool : !!splitOpenTools[tool]);
  });

  const canvas = document.getElementById('canvas-stage');
  canvas.innerHTML = "";

  if (viewMode === 'fullscreen') {
    if (focusedTool === 'drawings') canvas.appendChild(buildDrawingsPanel(false));
    else if (focusedTool === 'doc') canvas.appendChild(buildDocPanel(false));
    else if (focusedTool === 'sheet') canvas.appendChild(buildSheetPanel(false));
    else if (focusedTool === 'ppt') canvas.appendChild(buildPptPanel(false));
    else if (focusedTool === 'graph') canvas.appendChild(buildGraphPanel(false));
    else if (focusedTool === 'vault') canvas.appendChild(buildVaultPanel(false));
  } else {
    if (splitOpenTools.drawings) canvas.appendChild(buildDrawingsPanel(true));
    if (splitOpenTools.doc) canvas.appendChild(buildDocPanel(true));
    if (splitOpenTools.vault) canvas.appendChild(buildVaultPanel(true));
    if (splitOpenTools.sheet) canvas.appendChild(buildSheetPanel(true));
    if (splitOpenTools.graph) canvas.appendChild(buildGraphPanel(true));
    if (splitOpenTools.ppt) canvas.appendChild(buildPptPanel(true));
  }

  renderBottomTaskbar();
}

function renderBottomTaskbar() {
  const c = document.getElementById('active-pills-container');
  c.innerHTML = "";
  const names = { drawings: "📐 Drawings", doc: "📝 Doc", vault: "📦 CAD Vault", sheet: "📊 Sheet", ppt: "📽️ Slides", graph: "📈 Graphs" };
  ['drawings', 'doc', 'vault', 'sheet', 'ppt', 'graph'].forEach(k => {
    const pill = document.createElement("div");
    const active = viewMode === 'fullscreen' ? (focusedTool === k) : splitOpenTools[k];
    pill.className = `active-pill ${active ? 'active-focused' : ''}`;
    pill.innerText = names[k];
    pill.onclick = () => { focusedTool = k; renderAll(); };
    c.appendChild(pill);
  });
}

function exportDataJson() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(workspaceData, null, 2));
  const a = document.createElement("a");
  a.href = dataStr;
  a.download = "ICEYE_PowerShare_Workspace_v14.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

window.onload = init;
</script>
