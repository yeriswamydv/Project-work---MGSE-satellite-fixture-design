<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerShare Studio v31 | Aerospace Smart MGSE Hub</title>
<style>
  :root {
    --bg-base: #090d16;
    --bg-sidebar: #0f172a;
    --bg-card: #1e293b;
    --bg-card-header: #172033;
    --border: #334155;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.25);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --sheet-color: #10b981;
    --doc-color: #3b82f6;
    --ppt-color: #f97316;
    --graph-color: #a855f7;
    --vault-color: #ec4899;
    --dwg-color: #06b6d4;
    --status-green: #22c55e;
    --status-yellow: #eab308;
    --status-orange: #f97316;
    --status-red: #ef4444;
    --danger: #ef4444;
    --sidebar-width-expanded: 230px;
    --sidebar-width-collapsed: 60px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-base);
    color: var(--text-main);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    background: var(--bg-sidebar);
    border-bottom: 1px solid var(--border);
    height: 52px;
    padding: 0 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    z-index: 60;
  }

  .header-left-group { display: flex; align-items: center; gap: 12px; }
  .sidebar-toggle-btn {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main);
    width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .sidebar-toggle-btn:hover { background: var(--border); }
  .header-brand { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; }
  .brand-chip { background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px; }
  .mode-indicator-badge { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; }
  .mode-admin { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }

  .header-actions { display: flex; align-items: center; gap: 10px; }
  .theme-select { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }
  
  .view-mode-toggle { display: flex; background: var(--bg-base); padding: 3px; border-radius: 6px; border: 1px solid var(--border); gap: 3px; }
  .mode-toggle-btn { background: transparent; border: none; color: var(--text-muted); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
  .mode-toggle-btn.active { background: var(--accent); color: #090d16; }

  .btn-icon {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main);
    font-size: 12px; padding: 6px 10px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-weight: 600; text-decoration: none;
  }
  .btn-icon:hover { background: var(--border); color: #fff; }
  .btn-icon-primary { background: var(--accent); color: #090d16; border-color: var(--accent); }
  .btn-icon-danger { color: var(--danger); }
  .btn-icon-danger:hover { background: var(--danger); color: #fff; }

  /* USER MENU */
  .user-profile-menu { position: relative; }
  .user-pill-btn { display: flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1px solid var(--border); padding: 4px 10px 4px 6px; border-radius: 20px; cursor: pointer; }
  .user-avatar-badge { width: 26px; height: 26px; border-radius: 50%; background: #2563eb; color: #fff; font-weight: 800; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .user-pill-name { font-size: 12px; font-weight: 700; color: var(--text-main); }
  .user-dropdown-card { display: none; position: absolute; top: 42px; right: 0; width: 250px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); padding: 8px; z-index: 100; }
  .user-dropdown-card.show { display: block; }
  .dropdown-header-info { padding: 8px 10px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
  .dropdown-action-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--text-main); cursor: pointer; }
  .dropdown-action-item:hover { background: var(--border); color: var(--accent); }

  /* WORKSPACE LAYOUT & SIDEBAR */
  .workspace-layout { flex: 1; display: flex; overflow: hidden; position: relative; }
  aside.left-sidebar {
    width: var(--sidebar-width-expanded); background: var(--bg-sidebar); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; justify-content: space-between; padding: 14px 8px; flex-shrink: 0; z-index: 20; transition: width 0.22s ease; overflow-x: hidden;
  }
  aside.left-sidebar.collapsed { width: var(--sidebar-width-collapsed); }
  .nav-group-title { font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); padding: 0 8px 10px 8px; white-space: nowrap; }
  aside.left-sidebar.collapsed .nav-group-title { display: none; }

  .tool-item-btn {
    width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 9px 12px;
    border-radius: 8px; background: var(--bg-card); border: 1px solid transparent; color: var(--text-main); font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 6px; white-space: nowrap;
  }
  .tool-item-btn:hover { background: var(--border); }
  .tool-item-btn.active-tool { border-color: var(--accent); background: rgba(56, 189, 248, 0.15); box-shadow: 0 0 10px var(--accent-glow); }
  .tool-icon-text { display: flex; align-items: center; gap: 8px; }
  .indicator-dot { width: 8px; height: 8px; border-radius: 50%; background: #475569; }
  aside.left-sidebar.collapsed .tool-label, aside.left-sidebar.collapsed .indicator-dot { display: none; }
  aside.left-sidebar.collapsed .tool-item-btn { justify-content: center; padding: 10px 0; }

  .tool-item-btn[data-tool="sheet"] .indicator-dot { background: var(--sheet-color); }
  .tool-item-btn[data-tool="doc"] .indicator-dot { background: var(--doc-color); }
  .tool-item-btn[data-tool="ppt"] .indicator-dot { background: var(--ppt-color); }
  .tool-item-btn[data-tool="graph"] .indicator-dot { background: var(--graph-color); }
  .tool-item-btn[data-tool="vault"] .indicator-dot { background: var(--vault-color); }
  .tool-item-btn[data-tool="drawings"] .indicator-dot { background: var(--dwg-color); }
  .tool-item-btn[data-tool="contact"] .indicator-dot { background: #38bdf8; }

  /* CANVAS STAGE & PANELS */
  .canvas-stage { flex: 1; display: flex; gap: 12px; padding: 12px; background: var(--bg-base); overflow: hidden; }
  .window-panel { flex: 1; height: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.25); }
  .window-header { background: var(--bg-card-header); border-bottom: 1px solid var(--border); height: 42px; padding: 0 14px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .window-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .window-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

  /* DOC SECTION (SPLIT VIEW & RAW EDITOR) */
  .doc-split-editor { flex: 1; display: flex; gap: 12px; height: 100%; overflow: hidden; }
  .doc-pane { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  .doc-preview-pane { flex: 1; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 22px; overflow-y: auto; font-size: 14px; line-height: 1.7; }
  .doc-preview-pane h1 { font-size: 22px; margin-bottom: 12px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .doc-preview-pane h2 { font-size: 18px; margin: 16px 0 8px; color: var(--doc-color); }
  .math-formula { background: rgba(56, 189, 248, 0.1); color: #38bdf8; padding: 2px 6px; border-radius: 4px; font-family: serif; border: 1px solid rgba(56, 189, 248, 0.25); }

  /* TEXT SELECTION & COPY PERMISSION */
  *, *::before, *::after { -webkit-user-select: none; user-select: none; }
  textarea, input, .doc-textarea, .doc-preview-pane, td, th, p, li, h1, h2, h3, h4, span { -webkit-user-select: text !important; user-select: text !important; }

  footer.bottom-taskbar { height: 40px; background: var(--bg-sidebar); border-top: 1px solid var(--border); padding: 0 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; z-index: 25; }
  .active-pill { background: var(--bg-card); border: 1px solid var(--border); padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; }
  .active-pill.active-focused { background: var(--border); box-shadow: 0 0 6px var(--accent-glow); }

  /* CONTACT PANEL */
  .contact-panel-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; background: var(--bg-base); }
  .contact-hero-card { background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95)); border: 1px solid var(--border); border-radius: 12px; padding: 24px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
  .contact-big-avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff; font-size: 24px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  .contact-grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .contact-channel-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
  .channel-action-btn { width: 100%; padding: 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card-header); color: var(--text-main); font-size: 12px; font-weight: 700; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
  .channel-action-btn:hover { background: var(--accent); color: #090d16; border-color: var(--accent); }
</style>
</head>

<!-- TOP HEADER -->

  <div style="font-size:11px; color:var(--text-muted);">Mode: Complete Screen</div>

<script>
let isSidebarCollapsed = false;
function toggleSidebar() {
  isSidebarCollapsed = !isSidebarCollapsed;
  document.getElementById("app-sidebar").classList.toggle("collapsed", isSidebarCollapsed);
}

let isProject1Expanded = true;
function toggleProject1Collapse() {
  isProject1Expanded = !isProject1Expanded;
  document.getElementById("project1-sublist").style.display = isProject1Expanded ? "flex" : "none";
  document.getElementById("project1-chevron").innerText = isProject1Expanded ? "▾" : "▸";
}

function toggleUserDropdown() {
  document.getElementById("user-dropdown").classList.toggle("show");
}

/* WORKSPACE DATA & APP STATE */
const workspaceData = {
  sheetHeaders: ["Discipline", "Component / Parameter", "Design Value", "Unit", "Safety Margin", "Status"],
  sheet: [
    ["Mechanical CAD", "Top Base Ring Blank (Al 7075-T6)", "750.0", "mm OD", "30mm Billet, 68% Pocketed", "Completed"],
    ["Mechanical CAD", "Isogrid Pocket Pattern & Ribs", "60.0", "mm pitch", "3.0mm Rib, R3 Fillets", "Completed"],
    ["Electronics", "48V LiFePO4 Energy Architecture", "720.0", "Wh", "Isolated Cleanroom Pack", "Completed"],
    ["Mechatronics", "BLDC Motors & Roller Screws", "6x", "Units", "Zero-backlash actuators", "In Progress"]
  ],
  docSections: [
    {
      title: "1. Mechanical CAD & Kinematics",
      content: "## MECHANICAL CAD & STRUCTURAL INTEGRITY\n\nTop-level summary of the Mechanical Ground Support Equipment (MGSE) architecture for ICEYE microsatellites.\n\n- Machined from solid Al 7075-T6 billet (Ø750mm OD x 30mm thickness).\n- 68% mass reduction through equilateral triangular pocketing.\n- Critical Euler column buckling capacity: $P_{cr} = 64.8\\text{ kN}$ ($MS = +44.6$)."
    }
  ],
  slides: [
    { title: "Smart MGSE: Connected Assembly & Lifting", tag: "Slide 1", body: "• Tailored for ICEYE-class SAR microsatellites.\n• 6-DoF Stewart-Gough active-compliance rig.\n• Damps crane sway to < 2 N touch guidance." }
  ]
};

let viewMode = 'fullscreen';
let focusedTool = 'sheet';
let splitOpenTools = { sheet: true, graph: true, doc: false, ppt: false, vault: false, drawings: false, contact: false };
let docMode = 'split';
let activeDocSelection = { mainIndex: 0, subIndex: null };
let currentSlideIndex = 0;

function handleToolClick(tool) {
  if (viewMode === 'fullscreen') focusedTool = tool;
  else splitOpenTools[tool] = !splitOpenTools[tool];
  renderAll();
}

function setViewMode(mode) {
  viewMode = mode;
  document.getElementById('btn-mode-full').classList.toggle('active', mode === 'fullscreen');
  document.getElementById('btn-mode-split').classList.toggle('active', mode === 'split');
  document.getElementById('canvas-stage').classList.toggle('mode-fullscreen', mode === 'fullscreen');
  document.getElementById('canvas-stage').classList.toggle('mode-split', mode === 'split');
  renderAll();
}

function setDocDisplayMode(mode) {
  docMode = mode;
  renderAll();
}

/* RENDERERS */
function buildSheetPanel(isSplit) {
  const panel = document.createElement("div");
  panel.className = "window-panel";
  panel.innerHTML = `
    <div class="window-header">
      <div class="window-title" style="color:var(--sheet-color);"><span>📊</span> Engineering Spreadsheet Ledger</div>
      ${isSplit ? '<button class="btn-icon btn-icon-danger" onclick="closeToolInSplit(\'sheet\')">✕</button>' : ''}
    </div>
    <div class="window-content">
      <div class="sheet-scroll">
        <table class="sheet-table">
          <thead><tr><th>#</th>${workspaceData.sheetHeaders.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
          <tbody>
            ${workspaceData.sheet.map((r, i)=>`<tr><td>${i+1}</td>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
  return panel;
}

function buildDocPanel(isSplit) {
  const panel = document.createElement("div");
  panel.className = "window-panel";
  const sec = workspaceData.docSections[activeDocSelection.mainIndex] || workspaceData.docSections[0];

  panel.innerHTML = `
    <div class="window-header">
      <div class="window-title" style="color:var(--doc-color);"><span>📝</span> Technical Engineering Documentation</div>
      <div class="window-controls" style="display:flex; align-items:center; gap:8px;">
        <div class="view-mode-toggle" style="background:var(--bg-card); padding:2px;">
          <button class="mode-toggle-btn ${docMode === 'split' ? 'active' : ''}" onclick="setDocDisplayMode('split')">🌓 Split View</button>
          <button class="mode-toggle-btn ${docMode === 'preview' ? 'active' : ''}" onclick="setDocDisplayMode('preview')">👁️ Live Formatted</button>
          <button class="mode-toggle-btn ${docMode === 'edit' ? 'active' : ''}" onclick="setDocDisplayMode('edit')">✏️ Raw Editor</button>
        </div>
        ${isSplit ? '<button class="btn-icon btn-icon-danger" onclick="closeToolInSplit(\'doc\')">✕</button>' : ''}
      </div>
    </div>
    <div class="window-content" style="flex:1; display:flex; flex-direction:column; overflow:hidden; padding:0;">
      <div class="doc-split" style="display:flex; flex:1; overflow:hidden;">
        <!-- Left Side: Raw Source Box (Select & Copy Enabled) -->
        ${docMode !== 'preview' ? `
          <div class="doc-pane" style="${docMode === 'edit' ? 'flex:1;' : 'flex:1; border-right:1px solid var(--border); padding:16px;'}">
            <div style="font-size:10px; font-weight:700; color:var(--text-muted); margin-bottom:6px;">MARKDOWN / LATEX SOURCE (SELECT & COPY ENABLED)</div>
            <textarea class="doc-textarea" style="flex:1; width:100%; background:transparent; border:none; color:var(--text-main); font-family:inherit; font-size:13px; line-height:1.6; resize:none; outline:none;" oninput="workspaceData.docSections[activeDocSelection.mainIndex].content=this.value; renderAll();">${sec.content}</textarea>
          </div>
        ` : ''}
        <!-- Right Side: Live Formatted Preview -->
        ${docMode !== 'edit' ? `
          <div class="doc-pane" style="flex:1; padding:16px;">
            <div style="font-size:10px; font-weight:700; color:var(--accent); margin-bottom:6px;">LIVE FORMATTED PREVIEW</div>
            <div class="doc-preview-pane">
              <h2>${sec.title}</h2>
              <p style="margin-top:10px; white-space:pre-wrap;">${sec.content}</p>
            </div>
          </div>
        ` : ''}
      </div>
    </div>
  `;
  return panel;
}
